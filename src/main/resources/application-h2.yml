spring:
  datasource:
    url: ${H2_URL}
    username: sa
    password:
    driverClassName: org.h2.Driver
    generate-unique-name: false
  h2:
    console:
      enabled: true


  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
#    defer-datasource-initialization: true

  flyway:
    locations: classpath:db/migration/h2
    baselineOnMigrate: true
    enabled: true
    url: ${H2_URL}
    user: sa
    password: